pipeline:
  stages: [convert, train, eval]

sim:
  platform: fake
  language_instruction: "Fake task"

model:
  name: fake-model
  config_dir: fake-model/fake-robot

stages:
  convert:
    partition: cpu
    container: fake-converter
  train:
    partition: gpu
    gres: "gpu:1"
    container: fake-trainer
    max_steps: 1
  eval:
    partition: gpu
    gres: "gpu:1"
    container: fake-evaluator
    rounds: 1
